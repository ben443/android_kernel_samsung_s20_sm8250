name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 1.8
      uses: actions/setup-java@v2
      with:
        java-version: '1.8'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev bc bison flex libssl-dev

    - name: Build kernel
      run: |
        make clean
        make mrproper
        make ARCH=arm64 vendor/samsung/r8q.config
        make -j$(nproc) ARCH=arm64 all

    - name: Upload kernel
      uses: actions/upload-artifact@v3
      with:
        name: built-kernel
        path: /
